# 网站防御维护链

本文件是执行入口；规则以本仓库 `AGENTS.md`、`waf/PRINCIPLES.md` 为准，历史实测与恢复点见 `waf/README.md`。KPanel 的产品、安全、审计及发布规则以 KPanel 仓库现行规范为准。不要把此次试点的域名、IP、凭据或业务例外当成公共默认。

## 参数与授权

- `${{scope}}`：本轮涉及的规则、链路和消费端；未指定时根据需求盘点。
- `${{delivery}}`：本地候选、公开主线、KPanel 候选或已授权发布；未指定时以本次用户实际授权为准。
- `${{pilot}}`：经授权的试点环境；未指定时结合本次会话已有授权与上下文确认，不能把工作流本身视为生产操作授权。

工作流和已有记录本身不授予新的部署、发布、正式数据写入或后台监控权限；本次会话中仍适用的明确授权继续有效，无须重复确认。按任务风险确定验证强度，文档变更不机械运行生产测试。公开发布、试点与项目规范要求以实际授权和适用规则为准。

## Steps

### 1. 盘点并冻结基线

核对共享 Nginx/WAF、`kejilion.sh` 根目录与 CN 入口、当前使用的共享包提交/摘要及缓存、KPanel 实际固定的脚本、版本和发布状态。记录仓库默认主线、干净程度、相关本地候选、线上真实配置与恢复点；不要覆盖其他任务的改动。按范围核对 WAF 开关、规则与日志、可信代理与真实 IP、站点及别名、Fail2Ban Jail/filter/action、限流、CF 模式、源站与 CF 实际封禁和原有自定义项。

识别用户现有安装、旧版迁移、新安装、直连、CF 与其他反代的差异。未知的旧动作、超长或永久票据、无法证明的来源及自定义配置必须按现有工具的安全边界处理，不能静默删除或接管。记录真实行为与不确定项，先查现有测试和发布记录，不将短窗口试点推广成所有发行版已验证。

### 2. 设计与实现

确定防御事件到源站与 CF 的完整链路，单次拦截与累计封禁分开；按站点、客户端和来源隔离，保护代理、本机、信任地址及共享出口。CF 开关应统管适用的受管规则和回读；关闭 CF 模式后保留约定的源站防护。保留已有阈值、禁用项、凭据、用户例外、历史票据、SSH 防护及其他独立配置；迁移必须可诊断、幂等、可回滚。

默认复用同一共享包与原生脚本管理协议。KPanel 环境管理负责配置、开关、迁移和修复；网站流量与安全负责对应的状态、封禁与日志展示；职责以 KPanel 现行实现和用户指令为准，不自行创建平行封禁后端。涉及 KPanel 消费契约、固定脚本或界面时同步候选，并按其项目验证和发布流程处理。

涉及递进封禁时核验真实 Fail2Ban 版本与活跃票据：内存中的结束期限可能因重复命中延长而不同于数据库；异步更新、时间舍入、空 Jail、服务与同步进程时区、不同站点及来源、数据库不可用和并发事件都需要覆盖。24 小时级别不等同于持续命中或故障期间的绝对解封时限；历史记忆期取决于实际数据库配置。以实际生效期限和同步健康状态为准，不依靠静态配置推断 CF 已拦截。

### 3. 分层验证与独立复核

按变更执行相关单元、脚本根/CN 一致性、语法、共享包摘要和真实 Fail2Ban/Nginx 隔离集成；覆盖正常业务、恶意反例、真实 IP、防止跨站误封、新旧配置、CF 开关、增量封禁、手工解封、重启、动作丢失、数据库/网络故障、旧超长票据和回滚。需要时测试适用的 Fail2Ban 版本、时间格式、实际内存与数据库不一致、长时间未同步和高频并发。攻击、压力和故障注入仅可在隔离环境执行。

运行时防御变更按 `waf/PRINCIPLES.md` 先做独立复核，再进行已授权生产试点。记录精确候选、复核证据、已通过与未覆盖情况；复核发现阻断问题须修复后对最终提交重新核验。KPanel CF 安全审计必须遵循会话和 KPanel 现行的模型、角色、范围与审计流程；指定工具或配置不可用时如实报告，不以普通测试冒充专项审计。

### 4. 试点、发布与消费回读

仅在获得适用授权后，在试点记录当前运行版本、私有配置与回滚备份；使用已验证同一产物，小步应用，核对 Nginx 配置、Fail2Ban 实际动作与票据、源站表、CF 规则、同步健康、正常业务与真实脚本入口。不要在生产制造攻击样本；状态刚发生变化时区分待同步、持续故障和正常运行。出现相关异常停止推广，保留证据并按依赖顺序回滚和复核。

发布前再次确认远端、默认主线、精确提交及摘要；非 KPanel 仓库只在本地合入已验证候选后以显式主线到主线 refspec 推送，不推任务分支。先发布共享包并核验公开文件字节，再发布指向该提交和摘要的脚本，检查根/CN 入口与现有用户安装、迁移入口。KPanel 只在单独授权并满足其规范时发布；候选、本地验证和已部署状态分开记录。不得假定用户仅更新脚本后现有 Jail 已自动升级。

### 5. 留存与交付

在现有记录中写入变更范围、精确版本和摘要、独立复核、测试结果、已授权试点、公开回读、回滚点、版本号与更新日志、各端发布状态及未覆盖风险。说明已有用户何时通过菜单或原有入口应用更新。不要记录凭据或敏感日志。只声明真正完成的步骤；不建立后台任务或自动发布。

## 验证与停止条件

适用检查全部通过、产物身份一致、试点与公开回读有证据时才完成相应阶段；未授权、未验证或异常时明确停在对应阶段，保留旧防护及恢复点。后续改变适用组件或接口时更新本执行入口，但不复制或覆盖权威规范。
