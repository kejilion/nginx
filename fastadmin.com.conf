server {
    include /etc/nginx/conf.d/waf/server-default*.inc;

    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    server_name yuming.com;

    # Requires Nginx >= 1.29.3.
    add_header_inherit merge;
    ssl_certificate /etc/nginx/certs/yuming.com_cert.pem;
    ssl_certificate_key /etc/nginx/certs/yuming.com_key.pem;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    root /var/www/html/yuming.com/public;
    index index.php;

    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
        }
    }

    # Keep randomized admin.php PATH_INFO routes working after installation.
    location ~ ^(.+\.php)(/.*)?$ {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        set $fastadmin_path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastadmin_path_info;
        fastcgi_pass unix:/run/php74/php-fpm.sock;
        fastcgi_index index.php;
    }

    # Uploaded files are data; never execute PHP from the upload directory.
    location ^~ /uploads/ {
        location ~* \.(php[0-9]*|phtml|phar)(/|$) { return 404; }
        try_files $uri =404;
    }

    location ~ /\. { return 404; }

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    client_max_body_size 50m;
}
